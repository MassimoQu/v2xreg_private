_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Probe whether capping the number of FPFH points can push runtime toward ~0.01-0.05s.
# NOTE: The legacy config loader only supports a single level of _BASE_CONFIG_.

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 10
    max_nn_feature: 30
    max_points: 400

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 10
    max_nn_feature: 30
    max_points: 400

registration_modes:
  - name: ultra_fast
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 10
      max_nn_feature: 30
      max_points: 400
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 10
      max_nn_feature: 30
      max_points: 400

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 5.0
    max_iterations: 10
    method: point_to_point

teaser:
  noise_bound: 3.0
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 500

