data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/data_info_top3000.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  detection_cache: null
  use_detection: false
  feature_cache: data/DAIR-V2X/detected/veh_rsu_dual_bevpeaks_v2/stage1_boxes.json
  use_features: true
  feature_field: feature_corner3d_np_list
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 3000
filters:
  top_k: 32
  distance_m: 120
  priority_categories: [feature]
  min_confidence: 0.2
matching:
  # Descriptor-only alignment on BEV peak descriptors.
  strategy: ['descriptor_only']
  core_components: ['centerpoint_distance']
  filter_strategy: thresholdRetained
  filter_threshold: 0.0
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    feature: 1.25
  prior_weight: 0.0
  descriptor_seed: false
  descriptor_weight: 1.0
  descriptor_metric: l2
  descriptor_min_similarity: 0.1
  descriptor_max_pairs: 64
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 2
  inlier_threshold_m: 1.5
  mad_scale: 2.5
  min_inliers: 6
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: dair_v2xregpp_midfusion_bevpeaks_desc_only
