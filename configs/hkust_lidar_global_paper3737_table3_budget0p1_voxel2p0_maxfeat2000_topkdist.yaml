_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Same as `*_maxfeat2000_corr1500.yaml`, but uses a descriptor-based feature
# sampling heuristic (`feature_sampling=topk_distinct`) instead of random.

infra:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 2000
    feature_sampling: topk_distinct

vehicle:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 2000
    feature_sampling: topk_distinct

registration_modes:
  - name: budget0p1
    infra_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 2000
      feature_sampling: topk_distinct
    vehicle_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 2000
      feature_sampling: topk_distinct

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 4.0
    max_iterations: 10
    method: point_to_point

teaser:
  noise_bound: 2.5
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 60
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 1500

