_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Same voxelization as fast_voxel3p0, but spend a bit more compute budget on TEASER++
# to recover accuracy while keeping the total time close to ~0.1s.

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 10
    max_nn_feature: 30

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 10
    max_nn_feature: 30

registration_modes:
  - name: fast
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 10
      max_nn_feature: 30
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 10
      max_nn_feature: 30

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 5.0
    max_iterations: 10
    method: point_to_point

teaser:
  noise_bound: 3.0
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 500

