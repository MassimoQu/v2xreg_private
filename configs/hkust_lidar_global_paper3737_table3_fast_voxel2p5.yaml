_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Speed/accuracy trade-off targeting ~0.1s-ish territory.
# Empirically, voxel=3.0 hits ~0.08s but accuracy drops; voxel=2.0 is ~0.15s.
# This config aims for a middle ground.

infra:
  fpfh:
    voxel_size: 2.5
    radius_normal: 5.0
    radius_feature: 10.0
    max_nn_normal: 10
    max_nn_feature: 30

vehicle:
  fpfh:
    voxel_size: 2.5
    radius_normal: 5.0
    radius_feature: 10.0
    max_nn_normal: 10
    max_nn_feature: 30

registration_modes:
  - name: fast
    infra_fpfh:
      voxel_size: 2.5
      radius_normal: 5.0
      radius_feature: 10.0
      max_nn_normal: 10
      max_nn_feature: 30
    vehicle_fpfh:
      voxel_size: 2.5
      radius_normal: 5.0
      radius_feature: 10.0
      max_nn_normal: 10
      max_nn_feature: 30

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 5.0
    max_iterations: 10
    method: point_to_point

teaser:
  noise_bound: 2.5
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 300

