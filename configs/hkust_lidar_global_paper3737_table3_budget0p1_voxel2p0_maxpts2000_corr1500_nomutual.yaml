_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Same as `*_mutual.yaml`, but disables mutual NN filtering to reduce KD-tree time.
# This can be materially faster; accuracy depends on the scene overlap/outliers.

infra:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 15
    max_nn_feature: 50
    max_points: 2000

vehicle:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 15
    max_nn_feature: 50
    max_points: 2000

registration_modes:
  - name: budget0p1
    infra_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 15
      max_nn_feature: 50
      max_points: 2000
    vehicle_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 15
      max_nn_feature: 50
      max_points: 2000

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 4.0
    max_iterations: 10
    method: point_to_point

teaser:
  noise_bound: 2.5
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 50
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 1500

