data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/data_info_top3000.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  detection_cache: data/DAIR-V2X/detected/veh_rsu_dual_bevpeaks_occscore/stage1_boxes.json
  load_detection_hints: true
  use_detection: false
  feature_cache: data/DAIR-V2X/detected/veh_rsu_dual_bevpeaks_occscore/stage1_boxes.json
  use_features: true
  feature_field: feature_corner3d_np_list
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 3000
filters:
  top_k: 64
  distance_m: 120
  priority_categories: [feature]
  min_confidence: 0.25
matching:
  strategy: ['core', 'descriptor']
  core_components: ['centerpoint_distance']
  filter_strategy: thresholdRetained
  filter_threshold: 0.0
  matches2extrinsic: centerWeightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    feature: 4.0
  prior_weight: 3.0
  hint_core_component: centerpoint_distance
  hint_assignment: greedy
  occ_hint_rotation_max_deg: 180.0
  occ_hint_rotation_step_deg: 5.0
  occ_hint_min_peak_ratio: 0.8
  descriptor_seed: false
  descriptor_weight: 2.0
  descriptor_metric: cosine
  descriptor_min_similarity: 0.15
  descriptor_max_pairs: 128
  max_retained_matches: 128
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 4
  inlier_threshold_m: 2.0
  mad_scale: 2.5
  min_inliers: 6
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: dair_v2xregpp_midfusion_bevpeaks_occscore_step5_v1
