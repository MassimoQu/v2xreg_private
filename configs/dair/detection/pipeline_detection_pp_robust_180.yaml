data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/DAIR-V2X/cooperative/test_data_info.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  detection_cache: data/DAIR-V2X/detected/detected_boxes_test.json
  use_detection: true
  detection_field: pred_corner3d_np_list
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 1800
filters:
  top_k: 15
  distance_m: 120
  priority_categories: [bus, truck, car]
  size_bounds:
    __default__:
      min_l: 2.5
      max_l: 12.0
      min_w: 1.2
      max_w: 4.0
      min_h: 1.2
      max_h: 4.5
matching:
  strategy: ['category', 'core']
  core_components: ['centerpoint_distance', 'vertex_distance']
  filter_strategy: thresholdRetained
  filter_threshold: 4
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  resolve_180_ambiguity: true
  distance_thresholds:
    truck: 1.5
    van: 1.5
    bus: 1.5
    car: 1.0
    trafficcone: 0.5
    pedestrian: 0.5
    cyclist: 0.5
    motorcyclist: 0.5
    tricylist: 0.5
    barrawlist: 0.5
    detected: 1.0
  prior_weight: 0.0
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 3
  max_iterations: 2
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: dair_v2xregpp_pp15_robust_180
