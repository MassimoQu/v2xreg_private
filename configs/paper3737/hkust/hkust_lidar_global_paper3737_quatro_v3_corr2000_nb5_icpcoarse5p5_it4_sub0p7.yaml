_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Quatro tuning: higher noise bound + coarser ICP to lift 3m success.

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 2000
  beam_alignment:
    subsample_ratio: 0.7
    random_seed: 3407

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 2000

registration_modes:
  - name: coarse
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 2000
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 2000

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 5.0
    max_iterations: 4
    method: point_to_plane
    refine_voxel_size: 5.5
    refine_max_points: 20000

teaser:
  noise_bound: 5.0
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-05
  max_correspondences: 2000
