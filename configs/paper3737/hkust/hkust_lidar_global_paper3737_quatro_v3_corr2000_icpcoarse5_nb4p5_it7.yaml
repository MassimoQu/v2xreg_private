_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Quatro tuning: higher noise bound + more correspondences + moderate ICP.

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 1800

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 1800

registration_modes:
  - name: coarse
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 1800
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 1800

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 4.0
    max_iterations: 7
    method: point_to_plane
    refine_voxel_size: 5.0
    refine_max_points: 20000

teaser:
  noise_bound: 4.5
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-05
  max_correspondences: 2000
