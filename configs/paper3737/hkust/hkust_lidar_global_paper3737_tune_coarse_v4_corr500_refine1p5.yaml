_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Tuning: very coarse FPFH + more correspondences, refine at 1.5m voxel.

infra:
  fpfh:
    voxel_size: 4.0
    radius_normal: 8.0
    radius_feature: 16.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 800

vehicle:
  fpfh:
    voxel_size: 4.0
    radius_normal: 8.0
    radius_feature: 16.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 800

registration_modes:
  - name: coarse
    infra_fpfh:
      voxel_size: 4.0
      radius_normal: 8.0
      radius_feature: 16.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 800
    vehicle_fpfh:
      voxel_size: 4.0
      radius_normal: 8.0
      radius_feature: 16.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 800

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 1.5
    max_iterations: 60
    method: point_to_plane
    refine_voxel_size: 1.5
    refine_max_points: 12000

teaser:
  noise_bound: 2.5
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-05
  max_correspondences: 500
