_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Tuning: keep full-resolution FPFH but use TEASER++ settings closer to the
# budget config to improve success while staying near paper runtime.

teaser:
  noise_bound: 2.5
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 60
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 1500
