_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Mid-point between voxel1.5 and voxel3.0 (targeting ~0.1s-0.2s/frame).

infra:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 15
    max_nn_feature: 40

vehicle:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 15
    max_nn_feature: 40

registration_modes:
  - name: fast
    infra_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 15
      max_nn_feature: 40
    vehicle_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 15
      max_nn_feature: 40

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 4.0
    max_iterations: 15
    method: point_to_point

teaser:
  noise_bound: 2.5
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 50
  rotation_cost_threshold: 1.0e-08
  max_correspondences: 300

