_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# More accurate feature stage than voxel=3.0, still aiming for sub-second runtime.

infra:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 20
    max_nn_feature: 80

vehicle:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 20
    max_nn_feature: 80

registration_modes:
  - name: fast
    infra_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 20
      max_nn_feature: 80
    vehicle_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 20
      max_nn_feature: 80

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 5.0
    max_iterations: 60
    method: point_to_plane
    refine_voxel_size: 0.8
    refine_max_points: 20000
    refine_max_nn_normal: 30
    refine_radius_normal: 1.6

teaser:
  noise_bound: 2.5
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 80
  rotation_cost_threshold: 1.0e-08
  max_correspondences: 2500

