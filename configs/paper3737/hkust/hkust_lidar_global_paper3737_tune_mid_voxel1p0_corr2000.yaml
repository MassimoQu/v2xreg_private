_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Tuning: mid voxel size to balance success and runtime.

infra:
  fpfh:
    voxel_size: 1.0
    radius_normal: 2.0
    radius_feature: 5.0
    max_features: 4000

vehicle:
  fpfh:
    voxel_size: 1.0
    radius_normal: 2.0
    radius_feature: 5.0
    max_features: 4000

registration_modes:
  - name: mid
    infra_fpfh:
      voxel_size: 1.0
      radius_normal: 2.0
      radius_feature: 5.0
      max_features: 4000
    vehicle_fpfh:
      voxel_size: 1.0
      radius_normal: 2.0
      radius_feature: 5.0
      max_features: 4000

teaser:
  noise_bound: 2.5
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 60
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 2000
