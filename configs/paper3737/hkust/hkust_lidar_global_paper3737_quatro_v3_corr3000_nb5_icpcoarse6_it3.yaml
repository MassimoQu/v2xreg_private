_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Quatro tuning: more correspondences + coarse/short ICP to raise 3m without overfitting 1m.

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 3000

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 20
    max_nn_feature: 80
    max_features: 3000

registration_modes:
  - name: coarse
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 3000
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 20
      max_nn_feature: 80
      max_features: 3000

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 6.0
    max_iterations: 3
    method: point_to_plane
    refine_voxel_size: 6.0
    refine_max_points: 20000

teaser:
  noise_bound: 5.0
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-05
  max_correspondences: 3000
