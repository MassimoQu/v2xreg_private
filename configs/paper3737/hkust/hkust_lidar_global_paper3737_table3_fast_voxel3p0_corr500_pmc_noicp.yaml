_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Same as fast_voxel3p0_corr500_pmc, but disable ICP refinement to probe
# the speed/accuracy trade-off.

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 10
    max_nn_feature: 30

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 10
    max_nn_feature: 30

registration_modes:
  - name: fast
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 10
      max_nn_feature: 30
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 10
      max_nn_feature: 30

post_refine:
  icp:
    enabled: false

teaser:
  noise_bound: 3.0
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 40
  rotation_cost_threshold: 1.0e-06
  max_correspondences: 500

