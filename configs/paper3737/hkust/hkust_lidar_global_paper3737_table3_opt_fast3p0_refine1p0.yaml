_BASE_CONFIG_: configs/paper3737/hkust/hkust_lidar_global_paper3737_table3.yaml

# Goal: stay in the 0.1-1s regime but push success rate toward the paper numbers.
# Strategy:
# - keep FPFH stage coarse/fast (voxel=3.0)
# - improve correspondence quality (mutual + topk by feature distance)
# - run ICP refinement on a denser cloud (refine_voxel_size=1.0, point-to-plane)

infra:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 15
    max_nn_feature: 50

vehicle:
  fpfh:
    voxel_size: 3.0
    radius_normal: 6.0
    radius_feature: 12.0
    max_nn_normal: 15
    max_nn_feature: 50

registration_modes:
  - name: fast
    infra_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 15
      max_nn_feature: 50
    vehicle_fpfh:
      voxel_size: 3.0
      radius_normal: 6.0
      radius_feature: 12.0
      max_nn_normal: 15
      max_nn_feature: 50

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 3.0
    max_iterations: 30
    method: point_to_plane
    refine_voxel_size: 1.0
    refine_max_points: 12000
    refine_max_nn_normal: 30
    refine_radius_normal: 2.0

teaser:
  noise_bound: 3.0
  mutual_filter: true
  correspondence_sampling: topk_distance
  inlier_selection_mode: PMC_EXACT
  rotation_max_iterations: 50
  rotation_cost_threshold: 1.0e-08
  max_correspondences: 1000

