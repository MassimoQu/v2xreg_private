_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Drop the coarse mode; keep dense + ultra-dense only.
registration_modes:
  - name: dense
    infra_fpfh:
      voxel_size: 0.6
      radius_normal: 1.2
      radius_feature: 3.0
    vehicle_fpfh:
      voxel_size: 0.5
      radius_normal: 1.0
      radius_feature: 2.5
  - name: ultra_dense
    infra_fpfh:
      voxel_size: 0.4
      radius_normal: 0.8
      radius_feature: 2.0
    vehicle_fpfh:
      voxel_size: 0.4
      radius_normal: 0.8
      radius_feature: 2.0

