_BASE_CONFIG_: configs/hkust_lidar_global_paper3737_table3.yaml

# Aggressive ~0.1s target:
# - keep voxel=2.0 but reduce matching feature count
# - use heuristic inlier selection + fewer rotation iterations
# - light ICP refinement
#
# Expect lower accuracy than `*_maxfeat2000_corr1500.yaml`, but this is a better
# comparison point vs V2X-Reg++ runtimes.

infra:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 15
    max_nn_feature: 50
    max_features: 1500

vehicle:
  fpfh:
    voxel_size: 2.0
    radius_normal: 4.0
    radius_feature: 8.0
    max_nn_normal: 15
    max_nn_feature: 50
    max_features: 1500

registration_modes:
  - name: budget0p1_fast
    infra_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 15
      max_nn_feature: 50
      max_features: 1500
    vehicle_fpfh:
      voxel_size: 2.0
      radius_normal: 4.0
      radius_feature: 8.0
      max_nn_normal: 15
      max_nn_feature: 50
      max_features: 1500

post_refine:
  icp:
    enabled: true
    max_correspondence_distance: 4.0
    max_iterations: 5
    method: point_to_point

teaser:
  noise_bound: 3.0
  mutual_filter: false
  inlier_selection_mode: PMC_HEU
  rotation_max_iterations: 30
  rotation_cost_threshold: 1.0e-05
  max_correspondences: 500

