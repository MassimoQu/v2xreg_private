data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/DAIR-V2X/cooperative/test_data_info.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  sensor_frame: camera
  use_detection: false
  feature_cache: data/DAIR-V2X/detected/camera_disco_bevpeaks_smoke/cache_full.json
  use_features: true
  feature_field: feature_corner3d_np_list
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 200
filters:
  top_k: 32
  distance_m: 120
  priority_categories: [feature]
  min_confidence: 0.85
matching:
  strategy: [descriptor_only]
  core_components: [centerpoint_distance]
  filter_strategy: thresholdRetained
  filter_threshold: 0.0
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    feature: 2.0
  prior_weight: 0.0
  descriptor_seed: false
  descriptor_weight: 1.0
  descriptor_metric: cosine
  descriptor_min_similarity: 0.4
  descriptor_max_pairs: 64
  max_retained_matches: 64
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 2
  inlier_threshold_m: 1.5
  mad_scale: 2.5
  min_inliers: 6
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: camera_bevpeaks_smoke_k32_s0p4
