data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/DAIR-V2X/cooperative/test_data_info.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  sensor_frame: camera
  use_detection: true
  detection_cache: data/DAIR-V2X/detected/camera_2d_depth_desc_smoke/cache.json
  use_image_descriptors: true
  image_descriptor:
    method: timm
    model: timm:vit_small_patch14_dinov2
    model_input_size: 224
    device: cuda
    patch_size: [64, 64]
    grayscale: false
    min_area: 64.0
    max_boxes: 32
    priority_categories: [detected]
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 200
filters:
  top_k: 32
  distance_m: 120
  priority_categories: [detected]
  min_confidence: 0.0
matching:
  strategy: [category, core, descriptor]
  core_components: [centerpoint_distance, vertex_distance]
  filter_strategy: thresholdRetained
  filter_threshold: 4
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    detected: 4.0
  descriptor_weight: 3.0
  descriptor_metric: cosine
  descriptor_min_similarity: 0.2
  descriptor_max_pairs: 64
  descriptor_seed: true
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 3
  inlier_threshold_m: 2.0
  min_inliers: 3
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: camera_2d_depth_desc_smoke
