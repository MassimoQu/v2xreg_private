data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/DAIR-V2X/cooperative/test_data_info.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  sensor_frame: camera
  use_detection: false
  use_image_descriptors: true
  image_descriptor:
    method: hog
    patch_size: [32, 32]
    grayscale: true
    min_area: 32.0
    hog_cells: [2, 2]
    hog_bins: 8
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 1789
filters:
  top_k: 16
  top_k_candidates: [14, 16]
  distance_m: 120
  priority_categories: [bus, truck, car]
  min_confidence: 0.0
matching:
  strategy: ['category', 'core', 'descriptor']
  core_components: ['centerpoint_distance', 'vertex_distance']
  filter_strategy: thresholdRetained
  filter_threshold: 4
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    truck: 1.5
    van: 1.5
    bus: 1.5
    car: 1.0
    pedestrian: 0.5
    cyclist: 0.5
    motorcyclist: 0.5
    tricylist: 0.5
    detected: 1.0
  descriptor_weight: 3.0
  descriptor_metric: cosine
  descriptor_min_similarity: 0.2
  descriptor_max_pairs: 64
  descriptor_seed: true
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 3
  inlier_threshold_m: 2.0
  min_inliers: 3
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: camera_desc_hog_test_3m
