data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/data_info_top3000.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  sensor_frame: camera
  detection_cache: data/DAIR-V2X/detected/veh_rsu_dual_bevdesc/stage1_boxes.json
  use_detection: true
  detection_field: pred_corner3d_np_list
  use_image_descriptors: true
  image_descriptor:
    method: resnet
    model: resnet18
    model_input_size: 224
    device: cuda
    patch_size: [64, 64]
    grayscale: false
    min_area: 64.0
    max_boxes: 16
    priority_categories: [bus, truck, car]
    merge_mode: concat
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 200
filters:
  top_k: 30
  distance_m: 120
  priority_categories: [bus, truck, car]
  min_confidence: 0.0
matching:
  strategy: [category, core, descriptor]
  core_components: [centerpoint_distance, vertex_distance]
  filter_strategy: thresholdRetained
  filter_threshold: 4
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    truck: 1.5
    van: 1.5
    bus: 1.5
    car: 1.0
    pedestrian: 0.5
    cyclist: 0.5
    motorcyclist: 0.5
    tricylist: 0.5
    detected: 1.0
  descriptor_weight: 1.0
  descriptor_metric: cosine
  descriptor_min_similarity: 0.1
  descriptor_max_pairs: 128
  descriptor_seed: false
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 2
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: camera_desc_top3000_bevdesc_img_smoke_w1p0
