data:
  dataset: DAIR-V2X
  split: test
  data_info_path: data/DAIR-V2X/cooperative/test_data_info.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  sensor_frame: camera
  detection_cache: data/DAIR-V2X/detected/camera_cobevt_stage1/stage1_boxes.json
  use_detection: true
  use_image_descriptors: false
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: 1789
filters:
  top_k: 16
  top_k_candidates: [14, 16]
  distance_m: 120
  priority_categories: [bus, truck, car]
  min_confidence: 0.0
matching:
  strategy: [category, core]
  core_components: [centerpoint_distance, vertex_distance]
  filter_strategy: thresholdRetained
  filter_threshold: 4
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  distance_thresholds:
    truck: 1.5
    van: 1.5
    bus: 1.5
    car: 1.0
    pedestrian: 0.5
    cyclist: 0.5
    motorcyclist: 0.5
    tricylist: 0.5
    detected: 1.0
  prior_weight: 0.0
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 0
  max_iterations: 3
  inlier_threshold_m: 2.0
  min_inliers: 3
evaluation:
  success_thresholds: [1.0, 2.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: camera_det_cobevt
